<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRANSMISSION RECEIVED — December Vault</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<link rel="shortcut icon" type="image/x-icon" href="/favicon-batcave.ico?v=2">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon-batcave.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-batcave-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-batcave-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2">
<link rel="mask-icon" href="/assets/december-vault-symbol-black.svg?v=2" color="#d8d3c8">
<meta name="msapplication-TileColor" content="#050505">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--black:#050505;--bone:#d8d3c8;--ash:#7a756c;--tape:#2a2730;--blood:#4a0d12}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--black);color:var(--bone);
  font-family:'Courier Prime',monospace;
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  cursor:url('assets/goth-cursor.png') 16 4, crosshair;
  overflow:hidden;
}
a{cursor:url('assets/goth-cursor.png') 16 4, crosshair}
.scanlines{position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8) 100%)}
.box{text-align:center;padding:2rem;position:relative;z-index:2}
.cross{font-size:2.4rem;color:var(--ash);display:block;margin-bottom:2rem}
h1{font-family:'UnifrakturMaguntia',serif;font-weight:400;
  font-size:clamp(2.2rem,7vw,4.5rem);margin-bottom:1.6rem;
  text-shadow:0 0 30px rgba(216,211,200,.15)}
p{font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ash);line-height:2.2}
a.back{display:inline-block;margin-top:3rem;color:var(--bone);text-decoration:none;
  border:1px solid var(--tape);padding:.9em 2.2em;
  font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;transition:border-color .3s}
a.back:hover{border-color:var(--bone)}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="box">
  <span class="cross">†</span>
  <h1>Transmission received</h1>
  <p>your words have entered the vault.<br>replies come at night. they always do.</p>
  <a class="back" href="/">— return to the archive —</a>
</div>
</body>
</html>
